<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BioCollex Hero Performance Demo</title>

<meta name="description"
    content="Lightweight hero section performance demonstration.">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f7f7f5;
        color: #17221d;
    }

    .hero {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        text-align: center;
    }

    .hero-content {
        max-width: 700px;
    }

    .hero-label {
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 2px;
        margin-bottom: 18px;
    }

    h1 {
        font-size: clamp(42px, 7vw, 72px);
        line-height: 1.05;
        margin-bottom: 20px;
    }

    .hero-content p {
        max-width: 600px;
        margin: 0 auto 30px;
        font-size: 18px;
        line-height: 1.6;
        color: #5f6964;
    }

    .hero-button {
        display: inline-block;
        padding: 14px 24px;
        background: #17221d;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    .hero-button:focus {
        outline: 3px solid #65746d;
        outline-offset: 4px;
    }
</style>

</head>

<body>

<main>
    <section class="hero">
        <div class="hero-content">

            <p class="hero-label">
                RESEARCH COMPOUNDS
            </p>

            <h1>
                Quality research starts with confidence.
            </h1>

            <p>
                Explore research compounds with clear product
                information and laboratory-focused documentation.
            </p>

            <a href="#" class="hero-button">
                Explore Research
            </a>

        </div>
    </section>
</main>

</body>
</html>
